# qwen3-4b-think on hmmt_feb_2025.
#
# One competition, for date comparisons.
#
# Grading uses only what follows </think>: a reasoning model writes
# candidate answers while working, and those are not its answer.
#
# One config, one evaluation. Every field here also has a command-line flag,
# and for each field independently the command line wins, then this file, then
# evaluate.py's own default - the run prints each value with its source. Point
# --model at a checkpoint to evaluate that instead, and --output-path at where
# its three result files should land.

model: Qwen/Qwen3-4B
label: hmmt_feb_2025

data:
  - data/benchmark/hmmt_feb_2025.jsonl

samples: 16
verifier: symbolic
headline_metric: "pass@4"

temperature: 0.6
top_p: 0.95
top_k: 20
max_tokens: 30000
max_model_len: 32768
seed: 1234
enable_thinking: true
