# qwen3-4b-nothink on hmmt_feb_2026.
#
# One competition, post-cutoff for these models.
#
# enable_thinking: false makes Qwen3's template inject an empty
# <think></think>, which is how the mode is switched off.
#
# One config, one evaluation. Every field here also has a command-line flag,
# and for each field independently the command line wins, then this file, then
# evaluate.py's own default - the run prints each value with its source. Point
# --model at a checkpoint to evaluate that instead, and --output-path at where
# its three result files should land.

model: Qwen/Qwen3-4B
label: hmmt_feb_2026

data:
  - data/benchmark/hmmt_feb_2026.jsonl

samples: 16
verifier: symbolic
headline_metric: "pass@4"

temperature: 0.7
top_p: 0.8
top_k: 20
max_tokens: 8192
max_model_len: 16384
seed: 1234
enable_thinking: false
