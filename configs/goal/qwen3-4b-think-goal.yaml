# The goal-directed teacher arm. GENERATED by tools/make_goal_configs.py from
# configs/grpo/qwen3-4b-think-teacher.yaml -- do not hand-edit; regenerate.
#
# Every training setting is that file's, unchanged: G=32, 16 problems, 512
# rollouts per step, 20 steps, the same sampling and the same grader. Four things
# differ, and they are the experiment:
#
#   reference_tests   removed. The open-ended arm showed the teacher three
#                     benchmark curves after every update. This arm shows the
#                     three target problems and nothing else.
#   targets_file      the three problems, statements only. Written into the
#                     system prompt at run start.
#   targets_sealed    their answers, encrypted. The orchestrator holds the key
#                     in memory and strips it from the teacher's environment.
#   target_eval       how the targets are graded after each update.
#
# The teacher for this arm is claude-opus-4-8, which is also the model whose
# public per-problem record chose the targets: it solves Q1 and Q2 and does not
# solve Q3.

base_model: Qwen/Qwen3-4B
consecutive_failure_abort: 2
eval_base:
  gpu_memory_utilization: 0.9
  seed: 1234
  temperature: 0.6
  tensor_parallel_size: 1
  top_k: 20
  top_p: 0.95
eval_step_timeout_s: 10800
group_size: 32
grpo_config: qwen3-4b-think
halt_on_duplicate: true
keep_checkpoint_every: 5
max_evals_per_step: 10
n_gpus: 8
output_path: outputs/goal-teacher
pipeline_source:
- eval/evaluate.py
- eval/metrics.py
- eval/verifiers/extract.py
- eval/verifiers/symbolic.py
- eval/verifiers/exact_integer.py
- train/frontier_model/run_teacher_step.sh
- train/frontier_model/to_verl_dataset.py
- train/grpo/verl_reward.py
ppo_mini_batch_size: 8
steps: 20
target_eval:
  headline_metric: pass@1
  samples: 8
  verifier: symbolic
targets_file: data/goal_targets/arxiv3.problems.jsonl
targets_sealed: .secrets/arxiv3.sealed
teacher_eval:
  enable_thinking: true
  max_model_len: 32768
  max_tokens: 30000
  samples: 4
  verifier: symbolic
teacher_model: claude-opus-4-8
teacher_timeout_s: 1800
test_shards: 8
train_batch_size: 16
train_step_timeout_s: 10800
