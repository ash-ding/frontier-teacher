# The observational teacher-in-the-loop curriculum loop.
#
# This configures train/frontier_model/teacher/orchestrator.py, not an
# evaluation. Every field below can also be given on the command line, and for
# each field independently the command line wins, then this file, then the
# orchestrator's own default - the same rule eval/evaluate.py follows.

# --- teacher (a frontier model, driven through `claude -p`) --------------------
teacher_model: opus-4.8       # alias passed to `claude --model`
teacher_timeout_s: 1800       # kill a teacher turn that runs longer than this.
                              # The claude CLI has no turn cap, so this is the
                              # only guard against a turn that will not end.
halt_on_duplicate: true       # halt if a step's (decision, data) repeats verbatim
consecutive_failure_abort: 2  # recorded on the abort-log line. The loop is
                              # fail-safe and halts on the FIRST failure - a
                              # failed teacher turn, or a malformed decision.json
                              # or data.jsonl - so this is not a retry budget. It
                              # never best-effort parses and never retries.

# --- run / workspace -----------------------------------------------------------
# One step is one TRAINING update. Within a step the teacher may evaluate any
# number of times, always against the same checkpoint; the step closes only when
# it chooses to train. So `steps: 4` means four GRPO updates.
steps: 4
max_evals_per_step: 10        # reaching this without a train halts the run
                              # cleanly. A train is never fabricated to proceed.
output_path: outputs/frontier-model   # run_<timestamp>/ is created under here
n_gpus: 8

# --- student / GRPO ------------------------------------------------------------
grpo_config: llama32-3b                     # preset in run_teacher_step.sh
base_model: unsloth/Llama-3.2-3B-Instruct   # step-0 weights; matches the preset
train_max_problems: 16                      # extra teacher rows are truncated
train_step_timeout_s: 3600
eval_step_timeout_s: 3600

# --- what the teacher may read -------------------------------------------------
# One data file, copied into the run directory rather than mounted, so what the
# teacher read is part of the run's record. Omit the field for none.
# reference_data: /abs/path/to/some.jsonl

# Re-materialised from pristine git before every train or evaluate, so any edit
# the teacher makes to them is discarded and the real run uses validated code.
read_only_paths:
  - eval/verifiers/extract.py
  - eval/verifiers/symbolic.py
  - eval/verifiers/exact_integer.py
  - eval/evaluate.py
  - train/grpo/verl_reward.py
  - train/grpo/run_grpo.sh
  - train/grpo/to_verl_dataset.py

# --- how each step's evaluation is run -----------------------------------------
# eval/evaluate.py is invoked on the command line against the teacher's own
# data.jsonl; these supply its settings.
eval_base:
  temperature: 0.6
  top_p: 0.9
  top_k: -1
  seed: 1234
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
teacher_eval:
  n: 4                  # gives pass@1 through pass@4 from one run
  max_tokens: 4096
  max_model_len: 8192
  verifier: symbolic    # the teacher's problems are MATH-style exact forms
