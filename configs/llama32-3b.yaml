name: llama32-3b
model: unsloth/Llama-3.2-3B-Instruct   # non-gated mirror of meta-llama/Llama-3.2-3B-Instruct
# Llama 3.2 has no thinking/non-thinking split -> enable_thinking omitted entirely.
temperature: 0.6      # Meta's recommended decoding for 3.2 Instruct
top_p: 0.9
seed: 1234
tensor_parallel_size: 1
gpu_memory_utilization: 0.90
tasks:
  math500: {n: 4, max_tokens: 4096, max_model_len: 8192, data_file: benchmark/math500.jsonl, headline_metric: "pass@1"}
  aime:    {n: 8, max_tokens: 4096, max_model_len: 8192, data_files: [benchmark/aime_2020.jsonl, benchmark/aime_2021.jsonl, benchmark/aime_2022.jsonl, benchmark/aime_2023.jsonl, benchmark/aime_2024.jsonl], headline_metric: "pass@4"}
  mathtrain: {n: 32, max_tokens: 4096, max_model_len: 8192, data_files: [training_set/math_train_orig_train.jsonl, training_set/math_train_orig_test.jsonl], integer_answer: false}

  # HMMT: 30-33 problems per competition, harder than AIME. pass@1 sits on the
  # floor for a 3B model there, so pass@4 is the headline; 16 samples give the
  # whole pass@1/@4/@8/@16 ladder from one run. integer_answer must stay false -
  # 42 of the 93 answers are exact forms, not integers.
  hmmt: {n: 16, max_tokens: 4096, max_model_len: 8192, data_files: [benchmark/hmmt_feb_2025.jsonl, benchmark/hmmt_nov_2025.jsonl, benchmark/hmmt_feb_2026.jsonl], integer_answer: false, headline_metric: "pass@4"}
  hmmt_feb_2025: {n: 16, max_tokens: 4096, max_model_len: 8192, data_files: [benchmark/hmmt_feb_2025.jsonl], integer_answer: false, headline_metric: "pass@4"}
  hmmt_nov_2025: {n: 16, max_tokens: 4096, max_model_len: 8192, data_files: [benchmark/hmmt_nov_2025.jsonl], integer_answer: false, headline_metric: "pass@4"}
  hmmt_feb_2026: {n: 16, max_tokens: 4096, max_model_len: 8192, data_files: [benchmark/hmmt_feb_2026.jsonl], integer_answer: false, headline_metric: "pass@4"}
