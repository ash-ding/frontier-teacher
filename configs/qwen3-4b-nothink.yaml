name: qwen3-4b-nothink
model: Qwen/Qwen3-4B
enable_thinking: false
temperature: 0.7      # Qwen's official non-thinking preset
top_p: 0.8
top_k: 20
seed: 1234
tensor_parallel_size: 1
gpu_memory_utilization: 0.90
tasks:
  math500: {n: 4, max_tokens: 8192, max_model_len: 12288}
  aime:    {n: 8, max_tokens: 8192, max_model_len: 12288, data_files: [aime_2020.jsonl, aime_2021.jsonl, aime_2022.jsonl, aime_2023.jsonl, aime_2024.jsonl]}
  mathtrain: {n: 8, max_tokens: 8192, max_model_len: 12288, data_files: [math_train_orig_train.jsonl, math_train_orig_test.jsonl], integer_answer: false}
